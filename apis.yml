name: Anto Biosciences
description: >-
  Anto Biosciences is a frontier biology AI lab making the gut microbiome computable for the first
  time. It builds foundation models for microbial communities and quality-aware, goal-directed
  sparsification algorithms that filter noise from microbiome data to predict how the gut microbiome
  affects drug efficacy, toxicity, and safety across diverse populations (by geography, age, and diet).
  Applications include population-specific drug response prediction, identifying failure mechanisms at
  the microbial metabolic-pathway level, and molecule optimization for broader effectiveness. Backed by
  Y Combinator, the company is early stage and research-focused; it does not currently publish a public
  API, developer portal, SDKs, or a GitHub organization. This profile was added to the API Evangelist
  network as a lead and enriched with verified identity links only (no API artifacts, none published).
